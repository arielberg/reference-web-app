name: Register ACP deploy key

on:
  push:
    branches: [main]
    paths:
      - .github/acp-deploy-key.pub
      - .github/workflows/register-acp-deploy-key.yml
  workflow_dispatch:

permissions:
  administration: write

jobs:
  register-deploy-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure read-only deploy key exists
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = 'agent-control-plane-readonly';
            const key = fs.readFileSync('.github/acp-deploy-key.pub', 'utf8').trim();
            const { owner, repo } = context.repo;
            const existing = await github.rest.repos.listDeployKeys({ owner, repo, per_page: 100 });
            if (existing.data.some((entry) => entry.title === title)) {
              core.info(`Deploy key "${title}" already registered`);
              return;
            }
            await github.rest.repos.createDeployKey({
              owner,
              repo,
              title,
              key,
              read_only: true,
            });
            core.info(`Deploy key "${title}" registered`);
